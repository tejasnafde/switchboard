# gitleaks rules: the default set, plus the known false positives below.
# Every entry is scoped to one file and one match, so a real secret added
# beside them is still caught. Run locally with `gitleaks git --redact`.

[extend]
useDefault = true

[[allowlists]]
description = "Bitbucket credential test fixtures: fake token values, not credentials"
condition = "AND"
paths = [
  '''^tests/unit/source-control-credentials\.test\.ts$''',
  '''^tests/unit/pull-requests-ipc\.test\.ts$''',
]
regexes = ['''ATATT3xFfGF0-secret''', '''tok-12345678''']

[[allowlists]]
description = "Firebase client api_key in google-services.json: public by design (every APK carries it), committed for EAS Build"
targetRules = ["gcp-api-key", "generic-api-key"]
# Path AND the api_key field, never the key itself: a copy of the key here is
# reported by secret scanners as a second leak.
condition = "AND"
paths = ['''^apps/mobile/google-services\.json$''', '''^apps/android/app/google-services\.json$''']
regexTarget = "line"
regexes = ['''"current_key"\s*:\s*"AIza''']

[[allowlists]]
description = "Throwaway EC test key in PinnedTlsTest: minted by the desktop TLS code for the pinning test, it protects nothing"
targetRules = ["private-key"]
paths = ['''^apps/android/app/src/test/java/app/switchboard/mobile/platform/protocol/PinnedTlsTest\.kt$''']

[[allowlists]]
description = "HtmlLiveCard test: a sha256 source hash of a sample page, not a credential (the scanner matched the old constant name KEY)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^apps/mobile/src/components/__tests__/HtmlLiveCard\.test\.tsx$''']
regexes = ['''9235215ba9292f8dd21fecf0305a4b7d067e4cb41901b6840e8a6f5f2551a065''']
