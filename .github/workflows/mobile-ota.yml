# Mobile OTA pipeline (the JS lane).
#
# Publishes a new JS bundle to the EAS `production` update branch. Installed apps
# pick it up on their next foreground and offer a restart
# (apps/mobile/src/lib/otaUpdate.ts). No APK download, no install prompt, no
# store review.
#
# THIS LANE IS JS/ASSETS ONLY. A change that touches the native binary - a new
# native module, a new Android permission, an Expo SDK bump - cannot ship this
# way, because the bundle would call into native code the installed APK does not
# contain. Those changes need `mobile-release.yml`, which builds a fresh APK.
#
# The safety net is `runtimeVersion: { policy: "appVersion" }` in app.json: EAS
# only serves a bundle to a binary whose version matches, so even if someone
# pushes a native change down this lane, an old APK is never served a bundle it
# cannot run. It just sees no update. Bumping expo.version (which a native change
# requires anyway) therefore also parks the OTA lane until the new APK is out.
#
# REQUIRED REPO SECRET: EXPO_TOKEN (same one mobile-release.yml uses).
# This workflow is INERT until someone runs `npx eas update:configure` in
# apps/mobile once, which writes the `updates.url` and EAS projectId that are
# deliberately not hardcoded in app.json.
name: Mobile OTA Update

on:
  push:
    branches: [main]
    paths:
      # JS, assets, and app config only. Deliberately narrower than
      # mobile-release.yml's `apps/mobile/**`.
      - 'apps/mobile/src/**'
      - 'apps/mobile/App.tsx'
      - 'apps/mobile/index.ts'
      - 'apps/mobile/assets/**'
      - 'apps/mobile/app.json'
      # The shared wire protocol is bundled into the app, so a change here
      # changes the JS the phone runs.
      - 'src/shared/**'
  workflow_dispatch:

# Serialize publishes so two pushes cannot race to become the head of the
# production branch.
concurrency:
  group: mobile-ota
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/mobile

jobs:
  update:
    name: Publish OTA bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      # An OTA bundle goes straight to real devices with no build step to catch
      # a type error first, so this gate is the only thing standing between a
      # broken commit and every installed phone.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update
        run: |
          set -euo pipefail
          # Commit subject only (%s), so the message reads as one line in the
          # EAS dashboard and in `eas update:list`.
          MESSAGE=$(git log -1 --pretty=%s)
          eas update --branch production --message "$MESSAGE" --non-interactive
