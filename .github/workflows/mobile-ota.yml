# Mobile OTA pipeline (the JS lane).
#
# Publishes an iOS-only JS bundle to the EAS `production` update branch. The
# remaining React Native iOS app picks it up on its next foreground and offers a restart
# (apps/mobile/src/lib/otaUpdate.ts). No APK download, no install prompt, no
# store review.
#
# THIS LANE IS IOS JS/ASSETS ONLY. Native Android retired Expo OTA and receives
# only verified APKs from `mobile-release.yml`.
#
# The safety net is `runtimeVersion: { policy: "fingerprint" }` in app.json: EAS
# hashes the native project (native deps, config plugins, the native-affecting
# parts of app.json) and only serves a bundle to a binary with a matching hash.
# This replaced the `appVersion` policy, which only compared the version STRING
# and relied on a human remembering to bump it.
#
# REQUIRED REPO SECRET: EXPO_TOKEN.
# This workflow is INERT until someone runs `npx eas update:configure` in
# apps/mobile once, which writes the `updates.url` and EAS projectId that are
# deliberately not hardcoded in app.json.
name: Mobile OTA Update

on:
  push:
    branches: [main]
    paths:
      # JS, assets, and app config only. Deliberately narrower than
      # mobile-release.yml's `apps/mobile/**`.
      - 'apps/mobile/src/**'
      # ...but not the test layer, which is under src/ and ships nothing. A
      # test-only commit publishing a production OTA would push a pointless
      # restart prompt to every phone.
      - '!apps/mobile/src/**/__tests__/**'
      - '!apps/mobile/src/test/**'
      - 'apps/mobile/App.tsx'
      - 'apps/mobile/index.ts'
      - 'apps/mobile/assets/**'
      - 'apps/mobile/app.json'
      # The shared wire protocol is bundled into the app, so a change here
      # changes the JS the phone runs.
      - 'src/shared/**'
  workflow_dispatch:

# Serialize publishes so two pushes cannot race to become the head of the
# production branch.
concurrency:
  group: mobile-ota
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/mobile

jobs:
  update:
    name: Publish OTA bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      # The ROOT install too. This job's default working-directory is
      # apps/mobile, but the app imports `@shared/*` from the repo root, and
      # those files pull root dependencies (js-yaml, for one). Without this the
      # typecheck fails on a module that resolves fine on any machine that has
      # installed both.
      - name: Install root dependencies
        run: npm ci
        working-directory: .

      - name: Install dependencies
        run: npm ci

      # An OTA bundle goes straight to real devices with no build step to catch
      # a type error first, so this gate is the only thing standing between a
      # broken commit and every installed phone.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update
        run: |
          set -euo pipefail
          # Commit subject only (%s), so the message reads as one line in the
          # EAS dashboard and in `eas update:list`.
          MESSAGE=$(git log -1 --pretty=%s)
          eas update --platform ios --branch production --message "$MESSAGE" --non-interactive
