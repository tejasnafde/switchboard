name: Native Android CI

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'scripts/verify-android-apk.mjs'
      - 'tests/unit/android-apk-verifier.test.ts'
      - 'tests/unit/android-native-ci.test.ts'
      - '.github/workflows/android-native-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'scripts/verify-android-apk.mjs'
      - 'tests/unit/android-apk-verifier.test.ts'
      - 'tests/unit/android-native-ci.test.ts'
      - '.github/workflows/android-native-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint, and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android gates
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease compileDebugAndroidTestKotlin

      - name: Locate Android build tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "::error::Android SDK root is unavailable"
            exit 1
          fi
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          if [[ ! -x "$BUILD_TOOLS/aapt2" || ! -x "$BUILD_TOOLS/apksigner" ]]; then
            echo "::error::aapt2 or apksigner is unavailable under $SDK_ROOT/build-tools"
            exit 1
          fi
          echo "AAPT2=$BUILD_TOOLS/aapt2" >> "$GITHUB_ENV"
          echo "APKSIGNER=$BUILD_TOOLS/apksigner" >> "$GITHUB_ENV"

      - name: Verify canonical release metadata
        run: |
          set -euo pipefail
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$RELEASE_APK" ]]; then
            echo "::error::assembleRelease produced no APK"
            exit 1
          fi
          node ../../scripts/verify-android-apk.mjs --metadata-only --apk "$RELEASE_APK"

      - name: Verify signed release evidence when present
        run: |
          set -euo pipefail
          SIGNED_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*-unsigned.apk' -print -quit)"
          if [[ -z "$SIGNED_APK" ]]; then
            echo "::notice::No signed canonical APK is present; strict signer verification remains a release-lane gate."
            exit 0
          fi
          CHECKSUM_FILE="${SIGNED_APK}.sha256"
          if [[ ! -f "$CHECKSUM_FILE" ]]; then
            echo "::error::Signed APK is missing required checksum metadata: $CHECKSUM_FILE"
            exit 1
          fi
          node ../../scripts/verify-android-apk.mjs --apk "$SIGNED_APK" --checksum "$CHECKSUM_FILE"

  instrumented:
    name: Compose UI tests (ThreadScreenRegressionTest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # First release of this emulator lane: non-blocking until it has demonstrated
    # stability across enough runs to trust as a required gate.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # The emulator needs nested virtualisation, which is off by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Scoped to the one instrumented class this rollout has actually exercised;
      # the other androidTest classes are not yet run in CI.
      - name: Run ThreadScreenRegressionTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: apps/android
          script: >-
            ./gradlew --no-daemon connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=app.switchboard.mobile.ui.thread.ThreadScreenRegressionTest

      - name: Upload connected test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-reports
          path: |
            apps/android/app/build/reports/androidTests/connected/**
            apps/android/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore
          retention-days: 14
