# Release pipeline.
#
# Trigger: deliberate manual dispatch or a `v*` tag push. The matrix runs
# in parallel on macOS arm64 + Windows x64. A single prepare job creates a
# hidden draft first, both builders upload into it, and verification publishes
# the macOS release after its assets pass verification; Windows follows.
#
# We do NOT run on every push - release-only avoids burning CI minutes
# on every commit while still catching regressions when a tag goes out.
# A separate `ci.yml` (not in this commit) covers per-PR typecheck/test.
#
# A complete credential set produces signed artifacts (and a notarized macOS
# app). No credentials preserves the supported unsigned contributor path.
# Partial credentials fail closed before packaging.
name: Release

on:
  push:
    tags:
      - 'v*'
  # A manual release keeps version choice with the operator. Dry runs package
  # the CI-verified main tree without creating tags or publishing.
  workflow_dispatch:
    inputs:
      version:
        description: Human-chosen desktop version (X.Y.Z, no v). Always releases immutable main.
        type: string
        required: true
      expected_sha:
        description: SHA from the reviewed dry run. Required for a real release; main must still match.
        type: string
        default: ''
      dry_run:
        description: Package both platforms without creating a tag or publishing anything.
        type: boolean
        default: true

# Serialize releases, including dry runs, without cancelling packaging midway.
concurrency:
  group: release-desktop
  cancel-in-progress: false

# Default GITHUB_TOKEN ships with read-only contents on new repos; electron-
# builder needs `contents: write` to create the Release and upload artifacts.
# Without this we get `403 Resource not accessible by integration` on the
# `POST /repos/.../releases` call. See:
# https://docs.github.com/actions/security-guides/automatic-token-authentication
permissions:
  contents: write
  actions: read

jobs:
  # The gate that used to be a line in docs/releasing.md ("make sure main is
  # green on CI"). A tag can be pushed at any moment, including from a branch
  # whose CI never ran, so the ordering has to be a property of the pipeline
  # rather than of whoever cut the release. Costs a few minutes and re-covers
  # the ubuntu leg that the build matrix (macos + windows) does not.
  ci_status:
    name: Main CI on this commit
    runs-on: ubuntu-latest
    outputs:
      green: ${{ steps.check.outputs.green }}
      sha: ${{ steps.plan.outputs.sha || github.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag || github.ref_name }}
      publish: ${{ github.event_name == 'push' || !inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Plan immutable main release
        id: plan
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/desktop-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.plan.outputs.sha || github.sha }}
        run: |
          set -euo pipefail
          n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=1" --jq '.total_count')
          echo "green=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "successful ci.yml runs on $SHA: $n"

  gate:
    name: Gate
    needs: ci_status
    # Main CI already passed on this exact commit: running it again proves nothing.
    if: needs.ci_status.outputs.green != 'true'
    uses: ./.github/workflows/ci.yml

  # electron-builder starts several uploads concurrently inside each platform
  # job. If no Release exists, those uploads can race one another to create it;
  # GitHub accepts one and rejects the other with 422 already_exists. Creating
  # one draft here gives every publisher a stable target and keeps incomplete
  # update feeds invisible to installed clients.
  prepare_release:
    name: Prepare draft release
    needs: [ci_status, gate]
    if: always() && needs.ci_status.result == 'success' && (needs.gate.result == 'success' || needs.gate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Create the tag on the CI-verified SHA
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.ci_status.outputs.tag }}
          SHA: ${{ needs.ci_status.outputs.sha }}
        run: |
          set -euo pipefail
          # A failed-job rerun can reuse the tag on the same immutable SHA.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .object.sha")
          if [ -n "$existing" ]; then
            [ "$existing" = "$SHA" ] || { echo '::error::Tag points at another SHA'; exit 1; }
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA"
          fi
      - name: Create one hidden release target
        if: needs.ci_status.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.ci_status.outputs.tag }}
          REPO: ${{ github.repository }}
          MAC_SIGNED: ${{ secrets.MAC_CSC_LINK != '' }}
          WIN_SIGNED: ${{ secrets.WIN_CSC_LINK != '' }}
        run: |
          set -euo pipefail
          if [ "$MAC_SIGNED" = "true" ]; then
            mac_note="macOS: signed with Developer ID and notarized."
          else
            mac_note="macOS: unsigned. After install, run \`xattr -d com.apple.quarantine /Applications/Switchboard.app\`, or right-click the app and choose Open."
          fi
          if [ "$WIN_SIGNED" = "true" ]; then
            win_note="Windows: signed with Authenticode."
          else
            win_note="Windows: unsigned. If SmartScreen warns, choose More info, then Run anyway."
          fi
          if draft=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft); then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_RUN_ATTEMPT" = 1 ]; then
              echo "::error::A draft already exists for this version; inspect and remove it before a new dispatch"
              exit 1
            fi
            [ "$draft" = true ] || { echo "::error::Release is already public; refusing to overwrite it"; exit 1; }
            echo "Release $TAG already exists; reusing its draft for this rerun."
          else
            gh release create "$TAG" --repo "$REPO" --draft --title "$TAG" --notes "Switchboard $TAG

          $mac_note
          $win_note"
          fi

  build_mac:
    needs: [ci_status, prepare_release]
    if: always() && needs.prepare_release.result == 'success'
    uses: ./.github/workflows/release-build.yml
    with:
      os: macos-15
      ref: ${{ needs.ci_status.outputs.sha }}
      version: ${{ needs.ci_status.outputs.version }}
      publish: ${{ needs.ci_status.outputs.publish == 'true' }}
    secrets: inherit

  # windows-2022, not windows-latest: windows-2025 ships no VC++ build toolchain,
  # so node-gyp cannot rebuild node-pty there.
  build_win:
    needs: [ci_status, prepare_release]
    if: always() && needs.prepare_release.result == 'success'
    uses: ./.github/workflows/release-build.yml
    with:
      os: windows-2022
      ref: ${{ needs.ci_status.outputs.sha }}
      version: ${{ needs.ci_status.outputs.version }}
      publish: ${{ needs.ci_status.outputs.publish == 'true' }}
    secrets: inherit

  # A partial Release is the worst outcome this pipeline can produce: the
  # install artifacts are useless without their `latest*.yml`, and a missing
  # one makes every client's update check quietly report "up to date". So each
  # platform's assets and manifest are asserted before clients can see them.
  # Asset names match what electron-builder produces (the Windows installer
  # name is hyphenated).
  #
  # macOS publishes the release as soon as its own assets check out. Windows
  # uploads into the same release when its slower build finishes, and its
  # manifest is checked then; until latest.yml lands, Windows clients simply
  # see no update yet.
  publish:
    name: Verify macOS assets and publish
    needs: [ci_status, build_mac]
    # Dry runs package without publishing, so there are no release assets to check.
    if: always() && needs.ci_status.outputs.publish == 'true' && needs.build_mac.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ci_status.outputs.sha }}
      - name: Assert the macOS assets and manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/verify-release-assets.sh "${{ needs.ci_status.outputs.tag }}" "${{ github.repository }}" mac
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.ci_status.outputs.tag }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --repo "$REPO" --draft=false --latest

  verify_windows:
    name: Verify Windows assets
    needs: [ci_status, build_win, publish]
    if: always() && needs.ci_status.outputs.publish == 'true' && needs.build_win.result == 'success' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ci_status.outputs.sha }}
      - name: Assert the Windows assets and manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/verify-release-assets.sh "${{ needs.ci_status.outputs.tag }}" "${{ github.repository }}" win
