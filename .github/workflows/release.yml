# Release pipeline.
#
# Trigger: pushing a tag matching `v*` (e.g. `v0.1.1`). The matrix runs
# in parallel on macOS arm64 + Windows x64. A single prepare job creates a
# hidden draft first, both builders upload into it, and verification publishes
# the release only after every installer and update manifest is present.
#
# We do NOT run on every push — release-only avoids burning CI minutes
# on every commit while still catching regressions when a tag goes out.
# A separate `ci.yml` (not in this commit) covers per-PR typecheck/test.
#
# A complete credential set produces signed artifacts (and a notarized macOS
# app). No credentials preserves the supported unsigned contributor path.
# Partial credentials fail closed before packaging.
name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger to validate the packaged build (esp. the Windows native
  # rebuild) on a branch without cutting a tag. Builds only, never publishes.
  workflow_dispatch:

# Cancel an in-flight run for the same tag if a re-tag happens. Avoids
# two parallel publishes racing to upload assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Default GITHUB_TOKEN ships with read-only contents on new repos; electron-
# builder needs `contents: write` to create the Release and upload artifacts.
# Without this we get `403 Resource not accessible by integration` on the
# `POST /repos/.../releases` call. See:
# https://docs.github.com/actions/security-guides/automatic-token-authentication
permissions:
  contents: write

jobs:
  # The gate that used to be a line in docs/releasing.md ("make sure main is
  # green on CI"). A tag can be pushed at any moment, including from a branch
  # whose CI never ran, so the ordering has to be a property of the pipeline
  # rather than of whoever cut the release. Costs a few minutes and re-covers
  # the ubuntu leg that the build matrix (macos + windows) does not.
  ci_status:
    name: Main CI on this commit
    runs-on: ubuntu-latest
    outputs:
      green: ${{ steps.check.outputs.green }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=1" --jq '.total_count')
          echo "green=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "successful ci.yml runs on $SHA: $n"

  gate:
    name: Gate
    needs: ci_status
    # Main CI already passed on this exact commit: running it again proves nothing.
    if: needs.ci_status.outputs.green != 'true'
    uses: ./.github/workflows/ci.yml

  # electron-builder starts several uploads concurrently inside each platform
  # job. If no Release exists, those uploads can race one another to create it;
  # GitHub accepts one and rejects the other with 422 already_exists. Creating
  # one draft here gives every publisher a stable target and keeps incomplete
  # update feeds invisible to installed clients.
  prepare_release:
    name: Prepare draft release
    needs: [ci_status, gate]
    if: always() && needs.ci_status.result == 'success' && (needs.gate.result == 'success' || needs.gate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Create one hidden release target
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it for this rerun."
          else
            gh release create "$TAG" --repo "$REPO" --draft --title "$TAG" --notes "Switchboard $TAG

          **Builds are unsigned.**
          macOS: after install, run \`xattr -d com.apple.quarantine /Applications/Switchboard.app\`, or right-click the app and choose Open.
          Windows: if SmartScreen warns, choose More info, then Run anyway."
          fi

  build_mac:
    needs: prepare_release
    if: always() && needs.prepare_release.result == 'success'
    uses: ./.github/workflows/release-build.yml
    with:
      os: macos-14
    secrets: inherit

  # windows-2022, not windows-latest: windows-2025 ships no VC++ build toolchain,
  # so node-gyp cannot rebuild node-pty there.
  build_win:
    needs: prepare_release
    if: always() && needs.prepare_release.result == 'success'
    uses: ./.github/workflows/release-build.yml
    with:
      os: windows-2022
    secrets: inherit

  # A partial Release is the worst outcome this pipeline can produce: the
  # install artifacts are useless without their `latest*.yml`, and a missing
  # one makes every client's update check quietly report "up to date". So each
  # platform's assets and manifest are asserted before clients can see them.
  # Asset names match what electron-builder produces (the Windows installer
  # name is hyphenated).
  #
  # macOS publishes the release as soon as its own assets check out. Windows
  # uploads into the same release when its slower build finishes, and its
  # manifest is checked then; until latest.yml lands, Windows clients simply
  # see no update yet.
  publish:
    name: Verify macOS assets and publish
    needs: build_mac
    # A manual dispatch builds without publishing, so there is nothing to check.
    if: always() && github.event_name == 'push' && needs.build_mac.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assert the macOS assets and manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/verify-release-assets.sh "${{ github.ref_name }}" "${{ github.repository }}" mac
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --repo "$REPO" --draft=false --latest

  verify_windows:
    name: Verify Windows assets
    needs: [build_win, publish]
    if: always() && github.event_name == 'push' && needs.build_win.result == 'success' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assert the Windows assets and manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/verify-release-assets.sh "${{ github.ref_name }}" "${{ github.repository }}" win
