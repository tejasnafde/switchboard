# One platform's release build, called by release.yml once per OS so the macOS
# build can publish without waiting for the slower Windows one.
name: Release build

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      ref:
        type: string
        default: ''
      version:
        type: string
        default: ''
      publish:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & publish (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22 (not 20) - `@electron/rebuild@4` and `node-abi@4` both
          # require >=22.12.0. Node 20 emits EBADENGINE warnings and
          # the CDN binary fetch flakes more often on the older runtime.
          node-version: '22.23.4'
          cache: 'npm'

      # `npm ci` (NOT `npm install`) - deterministic, faster, and it
      # honors optionalDependencies for the host platform automatically.
      # Do NOT pass `--no-optional`; that's what makes the per-platform
      # claude-agent-sdk binary install correctly.
      #
      # Retry on transient failures: the Electron download CDN (and the
      # Claude SDK's per-platform tarball) occasionally 502s on the
      # windows-latest runner. Three attempts with a short backoff is
      # enough to ride out the typical hiccup without masking a real
      # dependency error.
      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: npm ci

      # `npm run build` runs the test gate first, and the root vitest suite
      # imports pure logic out of apps/mobile, whose tsconfig extends
      # `expo/tsconfig.base`. Same reason ci.yml installs it - the build cannot
      # transform those files without it.
      - name: Install mobile dependencies
        run: npm ci --prefix apps/mobile

      # The version comes from the tag, so main needs no version-bump PR. A
      # manual dispatch supplies its human-chosen version below.
      - name: Set the version from the tag
        if: github.event_name == 'push'
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Set the human-chosen dispatch version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Typecheck and tests already passed on this commit (main CI or the Gate),
      # so the build skips them and keeps the packaged-app smoke test.
      - name: Build renderer + main
        run: npm run build:ci
        env:
          SB_SMOKE_CRASH_DIR: ${{ runner.temp }}/smoke-dumps

      - name: Upload smoke-test minidumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-dumps-${{ inputs.os }}
          path: ${{ runner.temp }}/smoke-dumps
          if-no-files-found: ignore

      - name: Select macOS signing mode
        if: runner.os == 'macOS'
        id: signing_mac
        run: node scripts/signing-mode.mjs mac
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # notarytool reads the App Store Connect API key from a .p8 file, so the
      # secret is written to a mode-600 file in the runner's temp dir and only
      # its path reaches electron-builder (APPLE_API_KEY).
      - name: Write the App Store Connect API key
        if: runner.os == 'macOS' && steps.signing_mac.outputs.mode == 'signed'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/apple-api-key"
          mkdir -p "$dir"
          key="$dir/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}

      - name: Select Windows signing mode
        if: runner.os == 'Windows'
        id: signing_windows
        run: node scripts/signing-mode.mjs windows
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # `--publish always` makes electron-builder upload artifacts to the
      # prepared GitHub draft matching the current tag. The two platform builds can
      # upload to that stable target concurrently with name-based dedup.
      # GH_TOKEN is needed to write to the Release.
      # The caller enables publishing only for tag pushes or a real dispatch.
      - name: Build & publish
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SB_SIGNING_MODE" = "signed" ]; then
            npx electron-builder --config electron-builder.signed.yml --publish "$PUBLISH_MODE"
          else
            npx electron-builder --publish "$PUBLISH_MODE"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_MODE: ${{ inputs.publish && 'always' || 'never' }}
          SB_SIGNING_MODE: ${{ steps.signing_mac.outputs.mode || steps.signing_windows.outputs.mode }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (steps.signing_mac.outputs.mode == 'signed' || steps.signing_windows.outputs.mode == 'signed') && 'true' || 'false' }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Keep dry-run packages for inspection
        if: '!inputs.publish'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-dry-run-${{ inputs.os }}
          path: |
            release/*.zip
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 7

      - name: Remove the App Store Connect API key
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -rf "$RUNNER_TEMP/apple-api-key"
