# TEMPORARY diagnostic for the Windows smoke-test access violation. Removed before merge.
name: wincrash-diag
on:
  push:
    branches: [fix/windows-quit-crash]
jobs:
  loop:
    name: smoke loop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: npm ci
      - run: npm run build:fast
      - name: Loop app.exit
        run: node scripts/smoke-loop-diag.mjs
        env:
          RUNS: '150'
          SB_SMOKE_EXIT: exit
      - name: Loop app.quit
        run: node scripts/smoke-loop-diag.mjs
        env:
          RUNS: '150'
          SB_SMOKE_EXIT: quit
      - name: Analyze dumps
        if: always()
        shell: pwsh
        run: |
          $dumps = Get-ChildItem -Recurse crash-dumps -Filter *.dmp -ErrorAction SilentlyContinue
          if (-not $dumps) { Write-Host "no dumps"; exit 0 }
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path $cdb)) { Write-Host "cdb not found"; Get-ChildItem "C:\Program Files (x86)\Windows Kits\10" -ErrorAction SilentlyContinue; exit 0 }
          $sym = "srv*C:\sym*https://msdl.microsoft.com/download/symbols;srv*C:\sym*https://symbols.electronjs.org"
          foreach ($d in ($dumps | Select-Object -First 3)) {
            Write-Host "=== $($d.FullName)"
            & $cdb -z $d.FullName -y $sym -lines -c ".symopt+0x40; .ecxr; kn 60; !analyze -v; ~*kn 25; q" 2>&1 | Out-String -Width 400 | Write-Host
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crash-dumps-${{ matrix.os }}
          path: crash-dumps
          if-no-files-found: ignore
