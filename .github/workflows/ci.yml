name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by release.yml so a tag cannot publish a tree this suite has not
  # passed. Keeping the gate in the pipeline means nobody has to remember
  # the "make sure main is green first" step from docs/releasing.md.
  workflow_call:

# Cancel superseded runs on the same branch / PR — saves CI minutes when
# someone pushes a fixup commit before the previous run finishes.
#
# `github.workflow` is part of the key because it resolves to the CALLER for a
# reusable workflow. Without it, release.yml's `gate` job shares a group with
# the push-triggered run for the same ref and cancels it, so a release (or a
# validation dispatch) on a branch wipes that branch's own CI record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feature-parity:
    name: Cross-surface feature policy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate changed feature scope
        if: github.event_name == 'pull_request'
        run: npm run validate:feature-parity -- --base "${{ github.event.pull_request.base.sha }}"

      - name: Validate feature manifest history
        if: github.event_name != 'pull_request'
        run: npm run validate:feature-parity -- --all

  test:
    name: Test (${{ matrix.os }})
    # Cross-platform matrix so Windows-only test breakage is caught at PR
    # time rather than during the release pipeline (where a failure blocks
    # artifact publish for everyone). macos-14 = Apple Silicon runner —
    # required for the per-platform claude-agent-sdk binary.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 to match release.yml — `@electron/rebuild@4` and `node-abi@4`
          # both require >=22.12.0; staying on 20 here would let an
          # engine-incompat warning slip into release.
          node-version: '22'
          cache: 'npm'

      # Linux-only: node-pty's native build needs build-essential + python3.
      # macOS + Windows runners ship the toolchain pre-installed.
      - name: Install system deps for node-pty (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      # Retry on transient flakes — the Electron CDN and the per-platform
      # Claude SDK tarball occasionally 502 on the windows-latest runner.
      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: npm ci

      # BEFORE the unit tests, and on every OS. The root vitest suite imports
      # pure logic out of apps/mobile, and esbuild resolves the nearest tsconfig
      # per file - apps/mobile/tsconfig.json, which extends `expo/tsconfig.base`
      # from the mobile app's own install. Without this, 16 test files fail to
      # transform on a clean checkout while passing on any machine that has run
      # the mobile install.
      - name: Install mobile dependencies
        run: npm ci --prefix apps/mobile

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The mobile component suite runs under jest, not vitest, because the root
      # vitest config cannot load anything importing react-native. Without this
      # step it sat outside every gate and nothing would notice it rotting.
      #
      # One OS only: these tests render components, and jest-expo resolves the
      # same platform variants everywhere, so a second and third runner would
      # re-run identical work. The install has to happen at the repo root too -
      # the tests reach `@shared/*` outside the package, so babel looks its
      # runtime helpers up from the root node_modules.
      - name: Mobile component tests
        if: matrix.os == 'ubuntu-latest'
        run: npm test --prefix apps/mobile

      # `build:ci`, not `build`. The `prebuild` lifecycle hook chains
      # `typecheck && test`, which the two steps above just ran, so plain
      # `npm run build` re-ran the whole suite a second time: 81 of the 93
      # seconds this step took on ubuntu, and ~95 of 108 on the windows
      # runner that sets the wall clock. `build:ci` keeps the `postbuild`
      # smoke test, which `build:fast` alone would skip.
      - name: Build
        run: npm run build:ci

  # Screenshot regression tests: eight screens in Dark, Light and Translucent
  # against e2e/snapshots/*-darwin.png (see e2e/visual-regressions.e2e.mjs).
  # Only the screens phase: the behaviour phase's native-glass check reads the
  # real desktop through vibrancy, and on this runner the window server does
  # not transmit the backdrop colours, so it fails there on every run.
  # Probed on macos-14 before landing: two runs matched each other exactly and
  # matched baselines generated on a developer Mac within tolerance.
  visual:
    name: Visual regressions (macOS)
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: npm ci

      # The fixture seeds the app's database with the sqlite3 CLI. The runner's
      # system sqlite3 is built without FTS5, which the schema's search
      # triggers need.
      - name: SQLite with FTS5
        run: |
          brew list sqlite >/dev/null 2>&1 || brew install sqlite
          echo "$(brew --prefix sqlite)/bin" >> "$GITHUB_PATH"

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Build
        run: npm run build:fast

      - name: Theme screenshots
        run: npm run test:e2e:visual
        env:
          SB_VISUAL_SCOPE: screens

      - name: Upload actual and diff PNGs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regressions
          path: e2e/artifacts/visual
