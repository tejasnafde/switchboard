name: Secret scan

# gitleaks over the commits a pull request or push adds, with the rules and
# reviewed false positives in .gitleaks.toml. The released binary, pinned by
# checksum, so no third-party action runs with this repo's token. Scanning commits rather than the tree catches a secret that was added and
# then deleted inside the same branch: it is still in the history.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks

      - name: Scan new commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Scan everything when there is no usable base: a new branch pushes an
          # all-zero `before`, and a force push can leave it unreachable.
          if [ -z "$BASE" ] || ! git merge-base --is-ancestor "$BASE" HEAD 2>/dev/null; then
            ./gitleaks git --redact --no-banner .
          else
            ./gitleaks git --redact --no-banner --log-opts="$BASE..HEAD" .
          fi
