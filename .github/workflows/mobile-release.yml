# Builds the native Android app bundle and uploads it to a Google Play track.
#
# Play holds the app signing key (Play App Signing). This lane signs the AAB
# with the upload key: the production keystore whose certificate is
# CANONICAL_SIGNER_SHA256 in scripts/verify-android-apk.mjs. Store it and the
# Play publisher service account as GitHub Actions secrets:
#
#   ANDROID_KEYSTORE_BASE64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON   JSON key of a service account invited in the
#                               Play Console for app.tn07.switchboard only
#
# With the `apk` input it also publishes a sideload APK as the GitHub release
# mobile-v<version>. bundletool builds a universal APK from the verified AAB and
# signs it with the same upload key, so it never upgrades a Play install (Play
# re-signs those with its own key). https://switchboard.tn07.dev/apk redirects
# to the newest release that has an .apk asset (Worker switchboard-apk in
# tn07-site). The release is never marked latest, so desktop auto-update keeps
# reading the desktop release.
#
# React Native iOS continues to use mobile-ota.yml. This lane never invokes EAS
# and uploads nothing until package, version, signer and permission checks pass.
name: Mobile Release (Native Android, Google Play)

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play test track. Promote to production in the Play Console.
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
      status:
        description: Release status. Play accepts only draft releases while the app is unpublished.
        type: choice
        default: completed
        options:
          - completed
          - draft
      play:
        description: Upload the AAB to the Play track.
        type: boolean
        default: true
      apk:
        description: Also publish a sideload APK as the GitHub release mobile-v<version>.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/android

env:
  BUNDLETOOL_VERSION: 1.18.3
  BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29

jobs:
  release:
    name: Build, verify, and upload the native AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also requests the legacy `tools` package, which
          # cmdline-tools 16 (runner image 2026-09-07+) no longer ships.
          packages: platform-tools

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read canonical native version
        id: version
        run: |
          set -euo pipefail
          chmod +x gradlew
          VERSION="$(./gradlew --no-daemon -q :app:printReleaseVersionName | tail -1)"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Invalid native Android versionName: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing APK release
        if: inputs.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="mobile-v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2> "$RUNNER_TEMP/release-view.err"; then
            echo "::error::Release $TAG already exists; increment versionName and versionCode"
            exit 1
          fi
          if ! grep -qx 'release not found' "$RUNNER_TEMP/release-view.err"; then
            cat "$RUNNER_TEMP/release-view.err"
            echo "::error::Could not check whether release $TAG exists"
            exit 1
          fi

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          if [[ "${{ inputs.play }}" == "true" && -z "$PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not configured"
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/switchboard-production.jks"
          test -s "$RUNNER_TEMP/switchboard-production.jks"

      - name: Run gates and build the signed AAB
        env:
          SWITCHBOARD_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/switchboard-production.jks
          SWITCHBOARD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SWITCHBOARD_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SWITCHBOARD_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest lintDebug bundleRelease compileDebugAndroidTestKotlin
          RELEASE_AAB="switchboard-${{ steps.version.outputs.version }}.aab"
          cp app/build/outputs/bundle/release/app-release.aab "$RELEASE_AAB"
          echo "RELEASE_AAB=apps/android/$RELEASE_AAB" >> "$GITHUB_ENV"
          # Only R8 writes a mapping; an empty value uploads none.
          MAPPING=app/build/outputs/mapping/release/mapping.txt
          if [[ -f "$MAPPING" ]]; then echo "MAPPING_FILE=apps/android/$MAPPING" >> "$GITHUB_ENV"; fi

      # Play reads native symbols from BUNDLE-METADATA. Without them it warns
      # that crash reports cannot be symbolicated.
      - name: Check the AAB carries native debug symbols
        run: |
          set -euo pipefail
          # Listed first: grep -q closing the pipe early fails unzip under pipefail.
          ENTRIES="$(unzip -Z1 "$GITHUB_WORKSPACE/$RELEASE_AAB")"
          if ! grep -q '^BUNDLE-METADATA/com.android.tools.build.debugsymbols/' <<< "$ENTRIES"; then
            echo "::error::The AAB has no native debug symbols (ndk.debugSymbolLevel in app/build.gradle.kts)"
            exit 1
          fi

      - name: Download bundletool
        run: |
          set -euo pipefail
          JAR="$RUNNER_TEMP/bundletool-all-$BUNDLETOOL_VERSION.jar"
          curl -fsSL --retry 3 -o "$JAR" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $JAR" | sha256sum --check
          echo "BUNDLETOOL_JAR=$JAR" >> "$GITHUB_ENV"

      - name: Verify package, version, signer, and permissions
        run: |
          set -euo pipefail
          OUTPUT="$(node ../../scripts/verify-android-apk.mjs --aab "$GITHUB_WORKSPACE/$RELEASE_AAB")"
          echo "$OUTPUT"
          if ! grep -qF "Verified Android release AAB: app.tn07.switchboard ${{ steps.version.outputs.version }} (" <<< "$OUTPUT"; then
            echo "::error::AAB versionName does not match ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Keep the AAB as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: switchboard-${{ steps.version.outputs.version }}-aab
          path: ${{ env.RELEASE_AAB }}
          retention-days: 90

      # Play refuses a versionCode it has already seen, so it enforces the
      # monotonic version itself.
      - name: Upload to Google Play
        if: inputs.play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.tn07.switchboard
          releaseFiles: ${{ env.RELEASE_AAB }}
          mappingFile: ${{ env.MAPPING_FILE }}
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}

      - name: Build the universal APK from the AAB
        if: inputs.apk
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/ks-pass" "$RUNNER_TEMP/key-pass"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/ks-pass"
          printf '%s' "$ANDROID_KEY_PASSWORD" > "$RUNNER_TEMP/key-pass"
          java -jar "$BUNDLETOOL_JAR" build-apks --mode=universal \
            --bundle="$GITHUB_WORKSPACE/$RELEASE_AAB" \
            --output="$RUNNER_TEMP/switchboard.apks" \
            --ks="$RUNNER_TEMP/switchboard-production.jks" \
            --ks-pass="file:$RUNNER_TEMP/ks-pass" \
            --ks-key-alias="$ANDROID_KEY_ALIAS" \
            --key-pass="file:$RUNNER_TEMP/key-pass"
          RELEASE_APK="switchboard-${{ steps.version.outputs.version }}.apk"
          unzip -p "$RUNNER_TEMP/switchboard.apks" universal.apk > "$RELEASE_APK"
          sha256sum "$RELEASE_APK" > "$RELEASE_APK.sha256"
          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_ENV"

      - name: Locate Android build tools
        if: inputs.apk
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          if [[ ! -x "$BUILD_TOOLS/aapt2" || ! -x "$BUILD_TOOLS/apksigner" ]]; then
            echo "::error::aapt2 or apksigner is unavailable under $SDK_ROOT/build-tools"
            exit 1
          fi
          echo "AAPT2=$BUILD_TOOLS/aapt2" >> "$GITHUB_ENV"
          echo "APKSIGNER=$BUILD_TOOLS/apksigner" >> "$GITHUB_ENV"

      - name: Verify the APK package, version, signer, and checksum
        if: inputs.apk
        run: |
          set -euo pipefail
          OUTPUT="$(node ../../scripts/verify-android-apk.mjs --apk "$RELEASE_APK" --checksum "$RELEASE_APK.sha256")"
          echo "$OUTPUT"
          if ! grep -qF "Verified Android release APK: app.tn07.switchboard ${{ steps.version.outputs.version }} (" <<< "$OUTPUT"; then
            echo "::error::APK versionName does not match ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Keep the APK for the publish job
        if: inputs.apk
        uses: actions/upload-artifact@v4
        with:
          name: switchboard-${{ steps.version.outputs.version }}-apk
          path: |
            apps/android/${{ env.RELEASE_APK }}
            apps/android/${{ env.RELEASE_APK }}.sha256
          retention-days: 90

  # The only job that can write to the repository: it publishes the verified
  # APK and nothing else.
  publish-apk:
    name: Publish the sideload APK
    needs: release
    if: inputs.apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Download the verified APK
        uses: actions/download-artifact@v4
        with:
          name: switchboard-${{ needs.release.outputs.version }}-apk

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum --check "switchboard-$VERSION.apk.sha256"
          gh release create "mobile-v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Switchboard Android $VERSION (sideload APK)" \
            --notes "Sideload APK for app.tn07.switchboard $VERSION, signed with the upload key. It cannot upgrade a Google Play install: uninstall that first." \
            --latest=false \
            "switchboard-$VERSION.apk" "switchboard-$VERSION.apk.sha256"
