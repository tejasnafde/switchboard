# Publishes the canonical native Android APK consumed by the in-app updater.
#
# The keystore must be the production EAS keystore used for the public v0.4.0
# APK. Export it once, verify its certificate fingerprint, and store the bytes
# and credentials as GitHub Actions secrets:
#
#   ANDROID_KEYSTORE_BASE64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# React Native iOS continues to use mobile-ota.yml. This lane never invokes EAS
# and must never publish an APK until strict package, version, signer and digest
# verification succeeds.
name: Mobile Release (Native Android APK)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-release
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/android

jobs:
  release:
    name: Build, verify, and publish native APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read canonical native version
        id: version
        run: |
          set -euo pipefail
          chmod +x gradlew
          VERSION="$(./gradlew --no-daemon -q :app:printReleaseVersionName | tail -1)"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Invalid native Android versionName: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=mobile-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether the release already exists
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; increment apps/android versionName and versionCode"
            exit 1
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Restore production signing keystore
        if: steps.guard.outputs.exists == 'false'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/switchboard-production.jks"
          test -s "$RUNNER_TEMP/switchboard-production.jks"

      - name: Run gates and build production-signed APK
        if: steps.guard.outputs.exists == 'false'
        env:
          SWITCHBOARD_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/switchboard-production.jks
          SWITCHBOARD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SWITCHBOARD_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SWITCHBOARD_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease compileDebugAndroidTestKotlin
          SOURCE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*-unsigned.apk' -print -quit)"
          if [[ -z "$SOURCE_APK" ]]; then
            echo "::error::Production signing did not produce a signed APK"
            exit 1
          fi
          RELEASE_APK="switchboard-${{ steps.version.outputs.version }}.apk"
          cp "$SOURCE_APK" "$RELEASE_APK"
          sha256sum "$RELEASE_APK" > "$RELEASE_APK.sha256"

      - name: Locate Android verification tools
        if: steps.guard.outputs.exists == 'false'
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/aapt2"
          test -x "$BUILD_TOOLS/apksigner"
          echo "AAPT2=$BUILD_TOOLS/aapt2" >> "$GITHUB_ENV"
          echo "APKSIGNER=$BUILD_TOOLS/apksigner" >> "$GITHUB_ENV"

      - name: Verify package, version, signer, and checksum
        if: steps.guard.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_APK="switchboard-${{ steps.version.outputs.version }}.apk"
          CHECKSUM_FILE="$RELEASE_APK.sha256"
          BADGING="$("$AAPT2" dump badging "$RELEASE_APK")"
          APK_VERSION_NAME="$(sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p" <<< "$BADGING" | head -1)"
          NEW_VERSION_CODE="$(sed -n "s/^package:.* versionCode='\([0-9][0-9]*\)'.*/\1/p" <<< "$BADGING" | head -1)"
          if [[ "$APK_VERSION_NAME" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::APK versionName $APK_VERSION_NAME does not match release tag ${{ steps.version.outputs.tag }}"
            exit 1
          fi

          PREVIOUS_APK_URL="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq \
            '[.[] | select(.draft == false and (.tag_name | startswith("mobile-v"))) | .assets[] | select(.name | endswith(".apk"))][0].browser_download_url // empty')"
          if [[ -n "$PREVIOUS_APK_URL" ]]; then
            curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/switchboard-previous.apk" "$PREVIOUS_APK_URL"
            node ../../scripts/verify-android-apk.mjs --identity-only --apk "$RUNNER_TEMP/switchboard-previous.apk"
            PREVIOUS_BADGING="$("$AAPT2" dump badging "$RUNNER_TEMP/switchboard-previous.apk")"
            PREVIOUS_VERSION_CODE="$(sed -n "s/^package:.* versionCode='\([0-9][0-9]*\)'.*/\1/p" <<< "$PREVIOUS_BADGING" | head -1)"
            if (( NEW_VERSION_CODE <= PREVIOUS_VERSION_CODE )); then
              echo "::error::Android versionCode $NEW_VERSION_CODE must exceed published versionCode $PREVIOUS_VERSION_CODE"
              exit 1
            fi
          fi
          node ../../scripts/verify-android-apk.mjs --apk "$RELEASE_APK" --checksum "$CHECKSUM_FILE"

      - name: Publish the GitHub release
        if: steps.guard.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Switchboard mobile ${{ steps.version.outputs.version }}" \
            --generate-notes \
            "switchboard-${{ steps.version.outputs.version }}.apk" \
            "switchboard-${{ steps.version.outputs.version }}.apk.sha256"
