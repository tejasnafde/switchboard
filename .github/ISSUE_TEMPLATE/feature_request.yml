name: Feature request
description: Suggest something Switchboard should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: Describe the behaviour, not the implementation. Say if it matters on the phone too.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
